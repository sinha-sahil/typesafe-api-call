name: Release and Deploy

on:
  push:
    branches: [beta, release]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      root_changed: ${{ steps.changes.outputs.root_changed }}
      mcp_changed: ${{ steps.changes.outputs.mcp_changed }}
      bump_type: ${{ steps.commit-info.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed directories
        id: changes
        run: |
          # Get the list of changed files compared to the previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if root package files changed (excluding mcp directory)
          ROOT_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -qvE '^mcp/' | grep -qE '\.(ts|js|json)$|^src/|^package\.json$|^README\.md$'; then
            ROOT_CHANGED="true"
          fi
          # More explicit check for root files
          if echo "$CHANGED_FILES" | grep -qE '^(src/|package\.json|tsconfig\.json|rollup\.config\.js)'; then
            ROOT_CHANGED="true"
          fi

          # Check if MCP files changed
          MCP_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -qE '^mcp/'; then
            MCP_CHANGED="true"
          fi

          echo "root_changed=$ROOT_CHANGED" >> $GITHUB_OUTPUT
          echo "mcp_changed=$MCP_CHANGED" >> $GITHUB_OUTPUT
          echo "Root changed: $ROOT_CHANGED"
          echo "MCP changed: $MCP_CHANGED"

      - name: Get commit info for version bump
        id: commit-info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

          # Determine semantic version bump based on commit message
          if [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?!: ]] || [[ "$COMMIT_MSG" =~ BREAKING[[:space:]]CHANGE ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Detected BREAKING CHANGE - will perform major version bump"
          elif [[ "$COMMIT_MSG" =~ ^feat(\(.+\))?: ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Detected feature commit - will perform minor version bump"
          elif [[ "$COMMIT_MSG" =~ ^fix(\(.+\))?: ]] || [[ "$COMMIT_MSG" =~ ^perf(\(.+\))?: ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Detected fix/perf commit - will perform patch version bump"
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "No specific commit type detected - defaulting to patch version bump"
          fi

  publish-root:
    needs: detect-changes
    if: needs.detect-changes.outputs.root_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version
        id: version-bump
        run: |
          BUMP_TYPE="${{ needs.detect-changes.outputs.bump_type }}"
          echo "Bumping root package version with type: $BUMP_TYPE"
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version bumped to: $NEW_VERSION"

      - name: Build project
        run: pnpm run build

      - name: Check if version already published
        id: version-check
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PACKAGE_NAME@$NEW_VERSION is already published..."
          if npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null; then
            echo "Version $NEW_VERSION is already published"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $NEW_VERSION is not published yet"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to NPM
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          echo "Publishing root package to NPM..."
          npm publish
          echo "Root package published successfully!"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and tag release
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          git add package.json
          git commit -m "chore: release typesafe-api-call $NEW_VERSION"
          git tag -a "$NEW_VERSION" -m "Release typesafe-api-call $NEW_VERSION"
          git push origin ${{ github.ref_name }}
          git push origin --tags
          echo "Released typesafe-api-call $NEW_VERSION"

  publish-mcp:
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install MCP dependencies
        working-directory: ./mcp
        run: npm install

      - name: Bump MCP version
        id: version-bump
        working-directory: ./mcp
        run: |
          BUMP_TYPE="${{ needs.detect-changes.outputs.bump_type }}"
          echo "Bumping MCP package version with type: $BUMP_TYPE"
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "MCP version bumped to: $NEW_VERSION"

      - name: Build MCP
        working-directory: ./mcp
        run: npm run build

      - name: Check if MCP version already published
        id: version-check
        working-directory: ./mcp
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Checking if $PACKAGE_NAME@$NEW_VERSION is already published..."
          if npm view "$PACKAGE_NAME@$NEW_VERSION" version 2>/dev/null; then
            echo "Version $NEW_VERSION is already published"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $NEW_VERSION is not published yet"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish MCP to NPM
        if: steps.version-check.outputs.should_publish == 'true'
        working-directory: ./mcp
        run: |
          echo "Publishing MCP package to NPM..."
          npm publish
          echo "MCP package published successfully!"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and tag MCP release
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          NEW_VERSION="${{ steps.version-bump.outputs.new_version }}"
          git add mcp/package.json
          git commit -m "chore: release typesafe-api-call-mcp $NEW_VERSION"
          git tag -a "mcp-$NEW_VERSION" -m "Release typesafe-api-call-mcp $NEW_VERSION"
          git push origin ${{ github.ref_name }}
          git push origin --tags
          echo "Released typesafe-api-call-mcp $NEW_VERSION"
